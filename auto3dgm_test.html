<!DOCTYPE html>
<html>

<head>
    <title>auto3dgm</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <!-- Using local or CDN references to Three.js, jQuery, etc. -->
    <script src="js/libs/three.min.js"></script>
    <script src="js/libs/jquery-2.1.4.min.js"></script>
    <script src="js/Detector.js"></script>
    <script src="js/loaders/OBJLoader.js"></script>
    <script src="js/controls/TrackballControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        body {
            color: #000;
            font-family: Monospace;
            font-size: 13px;
            background-color: #fff;
            margin: 0px;
        }

        #content {
            position: absolute;
            top: 0px;
            width: 80%;
            left: 10%;
            right: 10%;
            text-align: center;
        }

        #tccanvas {
            position: fixed;
            left: 0px;
            width: 100%;
            height: 100%;
        }

        .list-item {
            display: inline-block;
            margin: 1em;
            padding: 1em;
            box-shadow: 1px 2px 4px 0px rgba(0, 0, 0, 0.25);
        }

        .list-item .scene {
            width: 250px;
            height: 250px;
        }

        .list-item .description {
            color: #888;
            font-family: sans-serif;
            font-size: large;
            width: 200px;
            margin: 0.5em auto;
        }
    </style>
</head>

<body>
    <!-- Main canvas for multi-viewport rendering -->
    <canvas id="tccanvas"></canvas>

    <!-- Container for the "list items" (the stacked scenes) -->
    <div id="content"></div>

    <!-- Template snippet for each item we show on the page -->
    <script id="template" type="notjs">
    <div class="scene"></div>
    <div class="description">$</div>
  </script>

    <script>
        // If no WebGL, show a message
        if (!Detector.webgl) Detector.addGetWebGLMessage();

        var canvas;
        var scenes = [], camera, controls, renderer;
        var dist;

        // Directories for meshes (.obj) and landmarks (.json)
        var MESH_DIR = "aligned_meshes/";
        var LANDMARKS_DIR = "scaled_landmarks/";

        function init() {
            // Grab main canvas
            canvas = document.getElementById("tccanvas");

            // Create a WebGLRenderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setClearColor(0xFFFFFF);

            // Our template for each .obj + .json pair
            var template = document.getElementById("template").text;
            var content = document.getElementById("content");

            // Create a camera
            camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
            camera.position.z = -0.5;

            // Add trackball controls
            controls = new THREE.TrackballControls(camera, content);
            controls.rotateSpeed = 6.0;
            controls.zoomSpeed = 3.0;
            controls.panSpeed = 0.8;
            controls.staticMoving = true;
            controls.dynamicDampingFactor = 0.3;
            controls.addEventListener('change', render);

            // Start loading each .obj file in MESH_DIR
            loadMeshesAndLandmarks(function (objPath, baseName) {
                // 1) Create a new Scene
                var scene = new THREE.Scene();

                // 2) Create a container DIV
                var element = document.createElement("div");
                element.className = "list-item";
                // Put the scene name in the description
                element.innerHTML = template.replace('$', baseName);
                scene.element = element.querySelector(".scene");
                content.appendChild(element);

                // 3) Lights
                var ambient = new THREE.AmbientLight(0x333333);
                var pointLight1 = new THREE.PointLight(0xffffff);
                pointLight1.position.set(100, 100, 100);
                var pointLight2 = new THREE.PointLight(0xffffff);
                pointLight2.position.set(-100, -100, -100);
                scene.add(ambient);
                scene.add(pointLight1);
                scene.add(pointLight2);

                // 4) Load the OBJ model
                var toothMaterial = new THREE.MeshPhongMaterial({
                    color: 0xCCCCCC,
                    specular: 0x000000,
                    shininess: 100,
                    emissive: 0x000000,
                    side: THREE.DoubleSide,
                    flatShading: true    // or "shading: THREE.FlatShading" in older versions
                });
                var manager = new THREE.LoadingManager();
                var loader = new THREE.OBJLoader(manager);

                loader.load(objPath, function (object) {
                    object.traverse(function (child) {
                        if (child instanceof THREE.Mesh) {
                            // Center geometry, apply material
                            child.geometry.center();
                            child.material = toothMaterial;
                        }
                    });
                    scene.add(object);

                    // Fit camera on first model loaded, if needed
                    if (dist === undefined) {
                        var bbox = new THREE.Box3().setFromObject(object);
                        var diameterVec = new THREE.Vector3();
                        diameterVec.subVectors(bbox.max, bbox.min);
                        var center = new THREE.Vector3();
                        center.addVectors(bbox.max, bbox.min).multiplyScalar(0.5);

                        var cameraSceneCenter = new THREE.Vector3();
                        cameraSceneCenter.subVectors(camera.position, center);
                        dist = diameterVec.length() / (2.0 * Math.tan(Math.PI / 8.0));
                        camera.position.addVectors(center, cameraSceneCenter.normalize().multiplyScalar(dist));
                        camera.lookAt(center);
                        camera.updateProjectionMatrix();
                    }
                });

                // 5) Load the JSON for Landmarks (matching baseName)
                var jsonURL = LANDMARKS_DIR + baseName + ".json";
                fetch(jsonURL)
                    .then(response => {
                        if (!response.ok) throw new Error("Failed to load " + jsonURL);
                        return response.json();
                    })
                    .then(jsonData => {
                        // Create a Points geometry from the "landmarks" array
                        var positions = [];
                        jsonData.landmarks.forEach(pt => {
                            positions.push(pt[0], pt[1], pt[2]);
                        });
                        var landmarkGeom = new THREE.BufferGeometry();
                        var positionAttr = new THREE.Float32BufferAttribute(positions, 3);
                        landmarkGeom.setAttribute('position', positionAttr);

                        // Create a Points Material
                        var pointsMat = new THREE.PointsMaterial({
                            color: 0xff0000,
                            size: 0.005, // control size of each point
                        });

                        // Create and add points to the scene
                        var points = new THREE.Points(landmarkGeom, pointsMat);
                        scene.add(points);

                    })
                    .catch(err => {
                        // It's okay if there's no matching JSON (or handle error).
                        console.warn("Landmarks JSON not found for " + baseName);
                    });

                // 6) Keep track of this scene
                scenes.push(scene);
                render();
            });

            render();
        }

        function loadMeshesAndLandmarks(onMeshFound) {
            // Look in MESH_DIR to find all .obj files, then call 'onMeshFound' with each
            $.ajax({
                url: MESH_DIR,
                success: function (data) {
                    // For each anchor that contains ".obj", extract the filename
                    $(data).find("a:contains(.obj)").each(function () {
                        var meshFile = $(this).attr("href"); // e.g. MyMesh.obj
                        var baseName = meshFile.split(".")[0]; // "MyMesh"
                        onMeshFound(MESH_DIR + meshFile, baseName);
                    });
                }
            });
        }

        // Render all scenes as in your original multi-viewport approach
        function render() {
            updateSize();
            renderer.setClearColor(0xFFFFFF);
            renderer.clear(true);
            renderer.setClearColor(0xE0E0E0);

            renderer.enableScissorTest(true);
            scenes.forEach(function (scene) {
                var element = scene.element;
                var rect = element.getBoundingClientRect();

                // If offscreen, skip
                if (rect.bottom < 0 || rect.top > renderer.domElement.clientHeight ||
                    rect.right < 0 || rect.left > renderer.domElement.clientWidth) {
                    return;
                }
                var width = rect.right - rect.left;
                var height = rect.bottom - rect.top;
                var left = rect.left;
                var bottom = renderer.domElement.clientHeight - rect.bottom;

                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setViewport(left, bottom, width, height);
                renderer.setScissor(left, bottom, width, height);
                renderer.render(scene, camera);
            });
            renderer.enableScissorTest(false);
        }

        function updateSize() {
            var width = canvas.clientWidth;
            var height = canvas.clientHeight;
            if (canvas.width !== width || canvas.height !== height) {
                renderer.setSize(width, height, false);
            }
            controls.handleResize();
        }

        function animate() {
            requestAnimationFrame(animate);
            render();
            controls.update();
        }

        // Initialize and animate
        init();
        animate();
    </script>
</body>

</html>
